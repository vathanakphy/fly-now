root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/flynow ./cmd/server"
entrypoint = ["./tmp/flynow"]
include_ext = ["go"]
exclude_dir = ["tmp", "vendor", ".git"]
exclude_unchanged = true
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 500000000

[log]
time = true

[misc]
clean_on_exit = true
