spring.application.name=${APP_NAME:fly-now-api}
server.port=${SERVER_PORT:8080}

# PostgreSQL: configure real values through environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fly_now}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.default-property-inclusion=non_null

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

logging.level.com.flynow.api=INFO

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.pagination.max-page-size=${MAX_PAGE_SIZE:100}
app.logging.slow-threshold-ms=${SLOW_SERVICE_THRESHOLD_MS:500}

# Authentication. Configure RSA keys in production; blank keys generate an ephemeral local key pair.
app.jwt.issuer=${JWT_ISSUER:fly-now-api}
app.jwt.audience=${JWT_AUDIENCE:fly-now-api}
app.jwt.key-id=${JWT_KEY_ID:fly-now-local}
app.jwt.private-key-base64=${JWT_PRIVATE_KEY_BASE64:}
app.jwt.public-key-base64=${JWT_PUBLIC_KEY_BASE64:}
app.jwt.access-token-minutes=${JWT_ACCESS_TOKEN_MINUTES:15}
app.auth.refresh-token-days=${REFRESH_TOKEN_DAYS:30}
app.auth.action-token-minutes=${ACTION_TOKEN_MINUTES:15}
app.auth.max-failed-logins=${MAX_FAILED_LOGINS:5}
app.auth.lock-minutes=${ACCOUNT_LOCK_MINUTES:15}
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.auth.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.auth.mail-enabled=${AUTH_MAIL_ENABLED:false}
app.auth.mail-from=${MAIL_FROM:no-reply@fly-now.local}
app.auth.compromised-password-check-enabled=${COMPROMISED_PASSWORD_CHECK_ENABLED:false}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
