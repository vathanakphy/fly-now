spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

debug=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.auth.refresh-cookie-secure=true
app.auth.frontend-url=${FRONTEND_URL}
app.auth.mail-enabled=true
app.auth.mail-from=${MAIL_FROM}

app.jwt.key-id=${JWT_KEY_ID}
app.jwt.private-key-base64=${JWT_PRIVATE_KEY_BASE64}
app.jwt.public-key-base64=${JWT_PUBLIC_KEY_BASE64}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
